<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./main.css" />
    <link
      rel="icon"
      href="/ChatGPT Image 3 сент. 2026 г., 17_06_10-Photoroom.png"
      type="image/x-icon"
    />
    <script defer src="./js/main.js"></script>
    <title>Todo</title>
  </head>
  <body class="body">
    <img
      class="img"
      width="312"
      height="312"
      src="./Iconarchive-Cute-Animal-Cute-Sheep.512.png"
      alt="Милая овечка"
    />
    <div class="app">
      <h1 class="title">Список дел</h1>
      <form class="form">
        <input
          class="input"
          type="text"
          name="new-todo"
          placeholder="Новая задача..."
          autocomplete="off"
          required
        />
        <button class="button-create button">Добавить</button>
      </form>
      <ul class="todos">
        <li class="todo">
          <div class="todo-text">Задача 1</div>
          <div class="todo-actions">
            <button class="button-complete button">&#10004;</button>
            <button class="button-delete button">&#10006;</button>
          </div>
        </li>
      </ul>
    </div>
  </body>
</html>
