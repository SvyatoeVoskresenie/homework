<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <link
      rel="icon"
      href="./img/ChatGPT Image 3 сент. 2026 г., 17_06_10-Photoroom.png"
      type="image/x-icon"
    />
    <script src="./js/main.js" type="module"></script>
    <title>Todo</title> 
  </head>
  <body class="body">
    <img
      class="img"
      width="312"
      height="312"
      src="./img/Iconarchive-Cute-Animal-Cute-Sheep.512.png"
      alt="Милая овечка"
    />
    <div class="app">
      <h1 class="title">Список дел</h1>
      <form class="form">
        <input
          class="input"
          type="text"
          name="new-todo"
          placeholder="Новая задача..."
          autocomplete="off"
          required
        />
        <button class="button-create button">Добавить</button>
      </form>
      <ul class="todos">
      </ul>
    </div>
  </body>
</html>
