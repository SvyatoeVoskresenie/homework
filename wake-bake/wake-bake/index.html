<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wake bakkkke</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="body">
    <div class="wrapper">
        <header class="header">
            <div class="header__top">
                <div class="container">
                    <div class="header__top-inner">
                        <a class="header__logo" href="#">
                            <img src="/img/icons/logos/logo-dark.svg" alt="Лого Wake&Bake">
                        </a>
                        <nav class="header__nav">
                            <ul class="header__nav-list">
                                <li class="header__nav-item">
                                    <a class="header__nav-link" href="#">
                                        Программа обучения
                                    </a>
                                </li>
                                <li class="header__nav-item">
                                    <a class="header__nav-link" href="#">
                                        Галерея
                                    </a>
                                </li>
                                <li class="header__nav-item">
                                    <a class="header__nav-link" href="#">
                                        Отзывы
                                    </a>
                                </li>
                                <li class="header__nav-item">
                                    <a class="header__nav-link" href="#">
                                        Контакты
                                    </a>
                                </li>
                            </ul>
                        </nav>
                        <a class="burger-icon" href="#">
                            <span></span>
                        </a>
                    </div>
                </div>
            </div>
            <div class="hero">
                <div class="container">
                    <div class="hero__inner">
                        <div class="hero__content">
                            <div class="hero__subtitle">
                                <span>Старт</span>
                                <span>26.06.2023</span>
                            </div>
                            <h1 class="hero__main-title">
                                Научись печь торты и десерты с нуля
                            </h1>
                            <p class="hero__text">
                                За 8 практических занятий ты получишь новые возможности для самореализации и любимое
                                дело
                            </p>
                            <div class="hero__img hero__img--mobile-800">
                                <img src="/img/content/girl.png" alt="Девушка с тортом Wake&Bake">
                                <div class="hero__img-controls">
                                    <a class="hero__img-button" data-fslightbox href="media/cake.mp4">
                                        <img src="/img/icons/play.svg" alt="Пуск">
                                    </a>
                                    Посмотри, как готовятся наши торты
                                </div>
                            </div>
                            <a class="hero__button button" href="#">Записаться на курс</a>
                        </div>
                        <div class="hero__img">
                            <img src="/img/content/girl.png" alt="Девушка с тортом Wake&Bake">
                            <div class="hero__img-controls">
                                <a class="hero__img-button" data-fslightbox="cake-video" href="media/cake.mp4">
                                    <img src="/img/icons/play.svg" alt="Пуск">
                                </a>
                                Посмотри, как готовятся наши торты
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main class="main"></main>
        <footer class="footer"></footer>
        <script src="js/fslightbox.js"></script>
        <script src="js/main.js"></script>
    </div>
</body>

</html>
